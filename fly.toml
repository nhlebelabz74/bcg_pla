# Fly.io settings for the hosted server. Change "app" if Fly says the name is taken.
app = "bcg-bag-tracker"
primary_region = "jnb"

[build]

[env]
  DATA_DIR = "/data"
  PUBLIC_URL = "https://bcg-bag-tracker.fly.dev"   # keep in step with "app" above

[mounts]
  source = "bagdata"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
